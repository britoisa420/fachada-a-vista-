services:
  - type: web
    name: fachada-em-vista
    runtime: docker
    plan: starter            # o disco persistente (banco e fotos) exige plano pago, a partir de US$ 7/mês
    healthCheckPath: /saude
    disk:
      name: dados
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
